function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);ship.x=ship.x?clamp(ship.x,25,W-25):W/2;ship.y=ship.y?clamp(ship.y,90,H-45):H*.77;stars=Array.from({length:Math.max(40,Math.floor(W*H/9000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,v:10+Math.random()*23}))}addEventListener('resize',resize);resize();

function die(){state='dead';fireHeld=false;pause.style.display='none';fire.style.display='none';joy.style.display='none';joyX=joyY=0;tone(130,.35,'sawtooth',.07);const b=[];if(!revived)b.push({label:'📺 REVIVE WITH AD',click:reviveAd});b.push({label:'↻ RESTART',secondary:!revived,click:newRun});show('GAME OVER','You reached level <b>'+level+'</b>.<br>Score: <b>'+score+'</b><br>'+(revived?'You have already used your revive.':'You can revive once per run with 2 lives.'),b)}
function reviveAd(){if(state!=='dead'||revived)return;revived=true;/* Integratiepunt: vervang deze demo door de rewarded-ad API van het hostplatform. Hervat alleen na confirmed reward callback. */state='ad';show('REWARDED AD — DEMO','<span id="adlabel">No real ad network is connected yet.</span><br>This is a test of the revive flow.',[{label:'▶ DEMO: CLAIM REWARD',click:()=>{if(state!=='ad')return;hp=2;startLevel();invuln=3;flash('REVIVE! +2 LIVES')}},{label:'CANCEL',secondary:true,click:()=>{state='dead';dieAfterAd()}}])}

addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowleft','arrowright','arrowup','arrowdown'].includes(k))e.preventDefault();keys[k]=true;if(k==='p'&&!e.repeat)togglePause();if(k===' '&&state==='menu')newRun()});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});addEventListener('blur',()=>{keys={};fireHeld=false;pointer=null});

function moveStick(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=e.clientX-cx,y=e.clientY-cy;const max=36,dist=Math.hypot(x,y);if(dist>max){x=x/dist*max;y=y/dist*max}joyX=x/max;joyY=y/max;stick.style.transform=`translate(${x}px,${y}px)`}

function burst(x,y,color,n=14){for(let i=0;i<n;i++){let a=Math.random()*6.283,s=45+Math.random()*220;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.4+Math.random()*.5,color})}}
function shoot(){if(fireClock>0)return;fireClock=powerType==='rapid'&&powerClock>0?.13:.30;let triple=powerType==='triple'&&powerClock>0;for(let vx of (triple?[-180,0,180]:[0]))bullets.push({x:ship.x,y:ship.y-23,r:4,vy:-780,vx,friendly:true});tone(760,.055,'square',.014)}

function update(dt){clock+=dt;powerClock=Math.max(0,powerClock-dt);shield=Math.max(0,shield-dt);powerSpawn-=dt;if(powerSpawn<=0){powerSpawn=9+Math.random()*5;objects.push({x:35+Math.random()*Math.max(1,W-70),y:-30,r:17,vy:120,vx:0,power:['rapid','shield','triple','heal'][Math.floor(Math.random()*4)],rot:0})}obstacleSpawn-=dt;if(obstacleSpawn<=0){obstacleSpawn=Math.max(2.3,5.5-level*.08)+Math.random()*2;{let health=Math.random()<.5?2:3;objects.push({x:30+Math.random()*Math.max(1,W-60),y:-35,r:24,vy:105+level*7,vx:0,obstacle:true,hp:health,maxHp:health,hit:false,rot:0})}}invuln=Math.max(0,invuln-dt);fireClock=Math.max(0,fireClock-dt);if(keys[' ']||fireHeld)shoot();const speed=360;let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyX,my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joyY;let len=Math.max(1,Math.hypot(mx,my));ship.x+=speed*mx/len*dt;ship.y+=speed*my/len*dt;ship.x=clamp(ship.x,24,W-24);ship.y=clamp(ship.y,92,H-43);
if(boss){boss.phase+=dt;let k=boss.kind,w=boss.world,range=Math.min(W*.36,215);boss.x=W/2+(k===0?Math.sin(boss.phase*1.2)*range:k===1?Math.sin(boss.phase*2.15)*range:k===2?Math.sin(boss.phase*.8)*range:Math.sin(boss.phase*1.6)*range);boss.y=110+(k===2?Math.sin(boss.phase*1.7)*35:0);boss.shot-=dt;if(boss.shot<=0){boss.shot=Math.max(.22,(k===0?.9:k===1?.65:k===2?.72:.48)-w*.045);let speed=175+w*20;if(k===0){for(let a=-1;a<=1;a++)objects.push({x:boss.x,y:boss.y+35,r:11,vy:speed,vx:a*(90+w*9),enemyShot:true})}else if(k===1){let dx=ship.x-boss.x,dy=Math.max(45,ship.y-boss.y),norm=Math.hypot(dx,dy);for(let a=-1;a<=1;a++)objects.push({x:boss.x,y:boss.y+35,r:12,vy:speed*dy/norm,vx:speed*dx/norm+a*65,enemyShot:true})}else if(k===2){for(let a=-2;a<=2;a++)objects.push({x:boss.x,y:boss.y+35,r:10,vy:speed*.88,vx:a*95+Math.sin(boss.phase*3)*45,enemyShot:true})}else{boss.spin+=.42;for(let a=0;a<7;a++){let angle=boss.spin+a*Math.PI*2/7;objects.push({x:boss.x,y:boss.y+30,r:10,vy:Math.cos(angle)*speed*.55+speed*.5,vx:Math.sin(angle)*speed,enemyShot:true})}}}}else{spawn-=dt;if(spawn<=0){spawn=Math.max(.22,.65-level*.07)*(0.7+Math.random()*.7);let good=Math.random()<.24;objects.push({x:30+Math.random()*Math.max(1,W-60),y:-30,r:good?14:18+Math.random()*7,vy:150+Math.min(level,18)*22+Math.random()*80,vx:0,good,rot:Math.random()*6.28})}}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.y+=b.vy*dt;b.x+=(b.vx||0)*dt;if(b.y< -30||b.x< -20||b.x>W+20){bullets.splice(i,1);continue}if(boss&&Math.hypot(b.x-boss.x,b.y-boss.y)<45){bullets.splice(i,1);boss.hp-=1;burst(b.x,b.y,'#ffbe66',2);if(boss.hp<=0){score+=250;ui();nextLevel();return}}}
for(let i=objects.length-1;i>=0;i--){let o=objects[i];if(o.obstacle){let desired=clamp((ship.x-o.x)*.65,-95,95);o.vx+=(desired-o.vx)*Math.min(1,dt*1.6)}o.y+=o.vy*dt;o.x+=(o.vx||0)*dt;o.rot=(o.rot||0)+dt*2;let destroyed=false;if(!o.good&&!o.power){for(let j=bullets.length-1;j>=0;j--){let b=bullets[j];if(Math.hypot(b.x-o.x,b.y-o.y)<o.r+b.r){bullets.splice(j,1);if(o.obstacle){if(!o.maxHp)o.maxHp=o.hp;o.hp--;o.hit=true;if(o.hp>0){burst(b.x,b.y,'#b6f9ff',5);tone(340,.055,'triangle',.022);destroyed=true;break}}objects.splice(i,1);burst(o.x,o.y,'#ff638a');tone(230,.12,'sawtooth',.04);score+=5;if(!boss&&!o.enemyShot){progress++;if(progress>=required){ui();nextLevel();return}}destroyed=true;break}}}if(destroyed)continue;if(Math.hypot(ship.x-o.x,ship.y-o.y)<ship.r+o.r-4){objects.splice(i,1);if(o.power){if(o.power==='heal'){hp=Math.min(3,hp+1);flash('❤️ EXTRA LIFE!')}else if(o.power==='shield'){shield=12;flash('🛡️ SHIELD: 12 SECONDS!')}else{powerType=o.power;powerClock=12;flash(o.power==='rapid'?'⚡ RAPID FIRE!':'🔱 TRIPLE SHOT!')}burst(o.x,o.y,'#7af8ff');powerSound();ui()}else if(o.good){addCoins(1);burst(o.x,o.y,'#ffe66b');ui()}else{damage();if(state!=='playing')return}}else if(o.y>H+40||o.x< -40||o.x>W+40)objects.splice(i,1)}
if(boss&&Math.hypot(ship.x-boss.x,ship.y-boss.y)<ship.r+43)damage();
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;p.t-=dt;if(p.t<=0)particles.splice(i,1)}if(toastClock>0){toastClock-=dt;if(toastClock<=0)toast.classList.remove('show')}ui()}
function poly(x,y,r,n,rot){g.beginPath();for(let i=0;i<n;i++){let a=rot+i*Math.PI*2/n;i?g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r):g.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}g.closePath()}
function star(x,y,r,rot){g.beginPath();for(let i=0;i<10;i++){let a=rot+i*Math.PI/5,rr=i%2?r*.45:r;i?g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):g.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath()}
function draw(t){let world=Math.floor((level-1)/5),palettes=[['#080d20','#192755','#5de9ff'],['#2b0b2e','#70254d','#ff74b7'],['#071d24','#135d52','#63ffb5'],['#27170b','#684014','#ffb347'],['#150b30','#40277b','#bd96ff']];let pal=palettes[world%palettes.length],bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,pal[0]);bg.addColorStop(1,pal[1]);g.fillStyle=bg;g.fillRect(0,0,W,H);g.save();g.globalAlpha=.12;for(let i=0;i<8;i++){let x=(i*179+world*87)%Math.max(1,W),y=(i*137+world*101)%Math.max(1,H);g.beginPath();g.arc(x,y,35+(i%3)*32,0,7);g.fillStyle=pal[2];g.fill()}g.restore();for(let s of stars){g.fillStyle='#a9c9ff88';g.beginPath();g.arc(s.x,(s.y+t*s.v)%H,s.r,0,7);g.fill()}g.strokeStyle=pal[2]+'22';for(let x=0;x<W;x+=60){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=t*20%60;y<H;y+=60){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
for(let o of objects){g.save();g.shadowBlur=17;g.shadowColor=o.good?'#ffe45d':'#ff4e75';if(o.obstacle){g.save();g.translate(o.x,o.y);g.rotate(o.rot);g.fillStyle='#ad5cdb';g.strokeStyle='#f3b8ff';g.lineWidth=3;g.beginPath();g.moveTo(0,-o.r-7);g.lineTo(o.r+8,0);g.lineTo(0,o.r+7);g.lineTo(-o.r-8,0);g.closePath();g.fill();g.stroke();g.fillStyle='#361c57';g.fillRect(-7,-7,14,14);g.restore();if(o.hit&&o.hp>0){let frac=o.hp/(o.maxHp||3),bw=54,bh=7,x=o.x-bw/2,y=o.y-o.r-24;g.fillStyle='#1a2035';g.fillRect(x-2,y-2,bw+4,bh+4);g.fillStyle=frac>.65?'#40e575':frac>.35?'#e8c34a':'#ff4c4c';g.fillRect(x,y,bw*frac,bh);g.strokeStyle='#dbe9ff';g.lineWidth=1;g.strokeRect(x,y,bw,bh)}}else if(o.power){g.beginPath();g.arc(o.x,o.y,o.r,0,7);g.fillStyle=o.power==='heal'?'#f05b90':o.power==='shield'?'#60d9ff':o.power==='rapid'?'#ffca55':'#a981ff';g.fill();g.font='bold 18px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#0c1431';g.fillText(({heal:'+',shield:'S',rapid:'⚡',triple:'3'})[o.power],o.x,o.y)}else if(o.good){g.beginPath();g.arc(o.x,o.y,o.r,0,Math.PI*2);g.fillStyle='#f5b937';g.fill();g.lineWidth=3;g.strokeStyle='#fff1a5';g.stroke();g.fillStyle='#87551a';g.font='bold 17px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText('C',o.x,o.y)}else{poly(o.x,o.y,o.r,o.enemyShot?5:7,o.rot);g.fillStyle=o.enemyShot?'#ff9b49':'#ff4a70';g.fill();g.strokeStyle='#ffb2c4';g.lineWidth=2;g.stroke()}g.restore()}
if(boss){g.save();g.shadowColor='#ff476d';g.shadowBlur=30;let sides=[8,3,6,10][boss.kind],r=[46,49,51,54][boss.kind];poly(boss.x,boss.y,r,sides,boss.phase*(boss.kind===3?1.1:.3));g.fillStyle=['#9d245e','#b53e31','#276f6c','#6234b9'][boss.kind];g.fill();g.strokeStyle=['#ff8b9e','#ffb45d','#65fff0','#e7a2ff'][boss.kind];g.lineWidth=5;g.stroke();g.fillStyle='#ffe36b';g.beginPath();g.arc(boss.x,boss.y,13,0,7);g.fill();g.restore()}
for(let b of bullets){g.save();g.shadowColor='#6affff';g.shadowBlur=14;g.fillStyle='#d6ffff';g.fillRect(b.x-3,b.y-12,6,19);g.restore()}for(let p of particles){g.globalAlpha=Math.min(1,p.t*2);g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,3,0,7);g.fill()}g.globalAlpha=1;
if(shield>0){g.beginPath();g.arc(ship.x,ship.y,31,0,7);g.strokeStyle='#6efaff';g.lineWidth=3;g.shadowColor='#6efaff';g.shadowBlur=18;g.stroke();g.shadowBlur=0}if(invuln<=0||Math.floor(t*12)%2===0){g.save();g.translate(ship.x,ship.y);g.shadowBlur=23;g.shadowColor='#4ceaff';g.beginPath();g.moveTo(0,-26);g.lineTo(21,19);g.lineTo(0,9);g.lineTo(-21,19);g.closePath();g.fillStyle='#4beaff';g.fill();g.strokeStyle='#e0ffff';g.lineWidth=2;g.stroke();g.beginPath();g.moveTo(-8,18);g.lineTo(0,33+Math.random()*8);g.lineTo(8,18);g.fillStyle='#ffb94e';g.fill();g.restore()}}
